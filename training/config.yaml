project:
  seed: 42
  output_dir: "outputs"

# Dataset gốc dùng để train MobileOne-S0 (PyTorch). Phải chứa 5 thư mục lớp bên dưới.
# KIỂM TRA source_dir trỏ đúng nơi chứa dataset trên máy bạn.
data:
  source_dir: "D:/NCKH/dataset"
  image_size: 224
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
  allowed_extensions: [".jpg", ".jpeg", ".png"]
  validate_images: true
  class_mapping:
    fresh_orange: GOOD
    blackspotted_orange: BAD
    cankered_orange: BAD
    rotten_orange: BAD
    green_orange: BAD

training:
  device: auto              # auto | cpu | cuda
  num_workers: 0            # Windows: thử 2-4 nếu CPU còn dư; 0 là an toàn nhất
  batch_size: 16
  head_epochs: 12
  fine_tune_epochs: 18
  head_learning_rate: 0.001
  fine_tune_learning_rate: 0.00001
  fine_tune_last_stages: 2  # thay cho fine_tune_last_layers: 30 (Keras). Số stage cuối của MobileOne mở khoá
  dropout: 0.20
  early_stopping_patience: 5
  reduce_lr_patience: 2
  reduce_lr_factor: 0.5
  # BatchNorm luôn frozen ở cả hai giai đoạn (trong code, không chỉnh ở đây).

threshold:
  min: 0.10
  max: 0.90
  step: 0.01

external_datasets:
  - name: "orange_disease_external"
    path: "D:/NCKH/dataset_3"
    class_mapping:
      fresh: GOOD
      rotten: BAD
     
